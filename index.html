<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Köprü: Deutsch für Türkischsprechende und Türkisch für Deutschsprechende – von A1 bis C1, mit Erklärungen, Übungen und Fehlertraining.">
  <meta name="theme-color" content="#3b5bdb">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Köprü">
  <script>
    /* Theme vor dem ersten Rendern setzen (kein Aufblitzen) */
    (function () {
      var th = 'system';
      try { th = (JSON.parse(localStorage.getItem('kopru.v1')) || {}).theme || 'system'; } catch (e) {}
      if (th === 'system') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', th);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
