name: Sprachausgabe (Piper TTS)

# Erzeugt bei jeder Inhaltsänderung die Audiodateien neu (nur neue Texte) und committet sie ins Repo.
on:
  push:
    branches: [main]
    paths:
      - 'js/content/**'
      - 'js/curriculum.js'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Piper-Stimmen zwischenspeichern
        uses: actions/cache@v4
        with:
          path: .piper-voices
          key: piper-voices-${{ hashFiles('tools/tts-voices.json') }}

      - name: ffmpeg und Piper installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet piper-tts

      - name: Texte sammeln
        run: node tools/extract-texts.js > "$RUNNER_TEMP/texts.json"

      - name: Audio erzeugen
        run: python tools/gen_audio.py "$RUNNER_TEMP/texts.json"

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Keine neuen Audiodateien."
            exit 0
          fi
          git commit -m "Audio aktualisiert (Piper TTS)"
          git pull --rebase origin main
          git push
