name: Inhalte prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax prüfen
        run: for f in js/*.js js/content/*.js tools/*.js; do node --check "$f"; done
      - name: Inhalte prüfen
        run: node tools/validate.js
