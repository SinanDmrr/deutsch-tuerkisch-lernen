  <script>
    /* Theme vor dem ersten Rendern setzen (kein Aufblitzen) */
    (function () {
      var th = 'system';
      try { th = (JSON.parse(localStorage.getItem('dt-data') || localStorage.getItem('kopru.v1')) || {}).theme || 'system'; } catch (e) {}
      if (th === 'system') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', th);
    })();
  </script>
